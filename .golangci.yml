version: "2"

run:
  timeout: 15m
  tests: true

# Keep a high-signal analyzer set with a clean, maintainable baseline. New
# analyzers are enabled only after their findings have been triaged and fixed;
# they are not hidden behind a broad suppression file.
linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - govet
    - ineffassign
    - lll
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
  settings:
    lll:
      # Match the golines formatter in nix/treefmt.nix so the linter and the
      # formatter measure lines the same way.
      line-length: 100
      tab-width: 4
    staticcheck:
      checks:
        # Start with correctness checks. Deprecations are tracked separately
        # because several compatibility paths intentionally use older APIs.
        - "SA*"
        - "-SA1019"
    govet:
      disable:
        # Go 1.26's experimental inlining suggestion is style-oriented rather
        # than a correctness check and churns reflect-kind comparisons.
        - inline
  exclusions:
    # Skip only files carrying the standard "Code generated ... DO NOT EDIT."
    # header, such as the protobuf bindings in pkg/ptygrpc.
    generated: strict

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
